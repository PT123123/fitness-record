<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>健身训练记录</title>
<script src="version.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root{
    --bg:#121212; --card:#1e1e1e; --card2:#262626; --line:#333;
    --txt:#eee; --sub:#999; --acc:#4fc3f7; --acc2:#2e9e5b; --warn:#ef5350; --chip:#333;
  }
  body{ font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--txt); line-height:1.5; padding-bottom:20px; padding-top:56px; }
  .wrap{ max-width:560px; margin:0 auto; padding:14px; }


  /* 顶栏 */
  .topbar{ position:fixed; top:0; left:0; right:0; max-width:560px; margin:0 auto; height:52px;
    display:flex; align-items:center; justify-content:space-between; background:#1a1a1a;
    border-bottom:1px solid var(--line); z-index:60; padding:0 6px; }
  .tb-btn{ background:none; border:none; color:var(--txt); font-size:21px; width:44px; height:44px;
    border-radius:10px; cursor:pointer; line-height:1; }
  .tb-btn:active{ background:var(--card2); }
  .tb-title{ font-size:16px; font-weight:700; }
  .tb-ver{ font-size:11px; color:var(--sub); font-weight:400; margin-left:6px; }
  .tb-spacer{ width:44px; height:44px; }

  /* 侧边栏 */
  .backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:65; opacity:0;
    pointer-events:none; transition:opacity .25s; }
  .backdrop.show{ opacity:1; pointer-events:auto; }
  .sidebar{ position:fixed; top:0; left:0; bottom:0; width:264px; background:#171717;
    border-right:1px solid var(--line); z-index:70; transform:translateX(-105%);
    transition:transform .25s ease; display:flex; flex-direction:column; padding:10px 12px; }
  .sidebar.open{ transform:translateX(0); }
  .sb-head{ display:flex; align-items:center; justify-content:space-between; padding:8px 2px 14px;
    border-bottom:1px solid var(--line); margin-bottom:12px; }
  .sb-title{ font-size:15px; font-weight:700; }
  .sb-nav{ display:flex; flex-direction:column; gap:6px; }
  .sb-nav button{ text-align:left; padding:13px 14px; border:none; background:none; color:var(--txt);
    font-size:15px; border-radius:10px; cursor:pointer; }
  .sb-nav button.on{ background:rgba(79,195,247,.12); color:var(--acc); font-weight:600; }
  .sb-stats{ margin-top:auto; padding:14px; background:var(--card2); border-radius:12px;
    font-size:13px; color:var(--sub); line-height:1.7; }
  .sb-stats b{ color:var(--acc); }
  .sb-foot{ padding:12px 4px 4px; color:#666; font-size:12px; text-align:center; }

  /* 设置：系统权限检查 */
  .perm-item{ background:var(--card); border-radius:12px; padding:12px 14px; margin-bottom:8px;
    display:flex; align-items:center; gap:10px; }
  .perm-item .p-info{ flex:1; min-width:0; }
  .perm-item .p-name{ font-size:15px; font-weight:600; }
  .perm-item .p-desc{ color:var(--sub); font-size:12px; margin-top:2px; }
  .p-state{ font-size:13px; font-weight:600; padding:4px 10px; border-radius:10px; flex:none; white-space:nowrap; }
  .p-state.ok{ color:var(--acc2); background:rgba(46,158,91,.15); }
  .p-state.no{ color:var(--warn); background:rgba(239,83,80,.15); }
  .p-act{ background:var(--acc); color:#001; border:none; border-radius:10px; padding:9px 13px;
    font-size:13px; font-weight:600; flex:none; cursor:pointer; }
  .p-act.ghost{ background:var(--card2); color:var(--txt); }

  h2{ font-size:16px; margin:4px 2px 12px; }
  .card{ background:var(--card); border-radius:14px; padding:16px; margin-bottom:14px; }

  /* timer */
  .mode-toggle{ display:flex; gap:8px; margin-bottom:12px; }
  .mode-toggle button{ flex:1; padding:9px; border-radius:10px; border:1px solid var(--line);
    background:var(--card2); color:var(--sub); font-size:14px; }
  .mode-toggle button.on{ background:var(--acc); color:#001; border-color:var(--acc); font-weight:600; }
  .time-display{ font-size:64px; font-weight:700; text-align:center; letter-spacing:2px;
    font-variant-numeric:tabular-nums; margin:6px 0; }
  .time-sub{ text-align:center; color:var(--sub); font-size:13px; margin-bottom:14px; }
  .btn-row{ display:flex; gap:10px; margin-bottom:6px; }
  .btn{ flex:1; padding:16px; border:none; border-radius:12px; font-size:16px; font-weight:600; }
  .btn-primary{ background:var(--acc); color:#001; }
  .btn-stop{ background:var(--warn); color:#fff; }
  .btn-ghost{ background:var(--card2); color:var(--txt); }
  .btn-green{ background:var(--acc2); color:#fff; }
  .btn:disabled{ opacity:.35; }

  .set-btn{ width:100%; padding:18px; margin-top:8px; border:2px dashed var(--acc);
    background:rgba(79,195,247,.08); color:var(--acc); border-radius:12px; font-size:17px; font-weight:700; }

  .dur-set{ display:flex; align-items:center; gap:10px; justify-content:center; margin:8px 0 14px; }
  .dur-set select{ background:var(--card2); color:var(--txt); border:1px solid var(--line);
    border-radius:8px; padding:8px 10px; font-size:15px; }

  /* 组记录列表 */
  .group-hint{ color:var(--sub); font-size:13px; margin:14px 2px 8px; display:flex; justify-content:space-between; align-items:center; }
  .group-hint .save-all{ color:var(--acc2); font-weight:600; font-size:14px; }
  .group-item{ background:var(--card2); border-radius:12px; margin-bottom:8px; overflow:hidden; }
  .group-head{ display:flex; align-items:center; padding:12px 14px; gap:10px; }
  .group-head .gidx{ font-weight:700; color:var(--acc); min-width:110px; }
  .group-head .gtime{ color:var(--sub); font-size:13px; font-variant-numeric:tabular-nums; }
  .group-head .gsplit{ color:var(--sub); font-size:12px; margin-left:6px; }
  .group-head .gsummary{ flex:1; text-align:right; font-size:14px; }
  .group-head .garrow{ color:var(--sub); margin-left:6px; transition:.2s; }
  .group-head.edited .gsummary{ color:var(--txt); }
  .empty{ color:var(--sub); text-align:center; padding:18px; font-size:14px; }

  /* 组内联编辑 */
  .group-edit{ padding:0 14px 14px; border-top:1px solid var(--line); }
  .field-label{ font-size:12px; color:var(--sub); margin:12px 0 6px; }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{ padding:8px 14px; background:var(--chip); border-radius:20px; font-size:14px; cursor:pointer; }
  .chip.on{ background:var(--acc); color:#001; font-weight:600; }
  .inline-input{ width:100%; background:var(--bg); border:1px solid var(--line); border-radius:10px;
    color:var(--txt); padding:11px 12px; font-size:15px; margin-top:6px; }
  .row2{ display:flex; gap:10px; }
  .row2 .inline-input{ flex:1; }
  .edit-actions{ display:flex; gap:10px; margin-top:14px; }
  .edit-actions .btn{ padding:12px; font-size:15px; }

  /* 到期记录条 */
  .finish-bar{ background:var(--warn); color:#fff; border-radius:12px; padding:14px; margin-top:12px;
    text-align:center; font-weight:600; animation:pulse 1.2s infinite; cursor:pointer; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.65;} }

  /* 记录/历史 */
  .rec-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .rec-head .rh-title{ font-size:15px; font-weight:600; }
  .rec-head .rh-close{ color:var(--warn); font-size:14px; font-weight:600; background:none; border:none; padding:4px 8px; }
  .preview{ background:var(--card2); border-radius:10px; padding:12px; margin:10px 0;
    color:var(--acc); font-size:15px; }
  .hist-date{ font-size:13px; color:var(--sub); margin:16px 2px 8px; }
  .hist-item{ background:var(--card); border-radius:12px; padding:12px 14px; margin-bottom:8px;
    display:flex; align-items:flex-start; gap:10px; }
  .hist-item .h-time{ color:var(--sub); font-size:12px; min-width:52px; }
  .hist-item .h-body{ flex:1; font-size:15px; }
  .hist-item .h-tag{ display:inline-block; background:var(--chip); color:var(--acc); border-radius:6px;
    padding:1px 7px; font-size:12px; margin-right:6px; }
  .del{ color:var(--warn); font-size:18px; padding:0 4px; background:none; border:none; }

  /* 导出 */
  pre{ background:#0a0a0a; border-radius:12px; padding:14px; font-size:13px; white-space:pre-wrap;
    word-break:break-all; max-height:60vh; overflow:auto; }
  .section-title{ font-size:14px; color:var(--sub); margin:14px 2px 8px; }
  .exp-field-list{ margin-top:6px; }
  .exp-field-row{ display:flex; align-items:center; gap:8px; background:var(--card2);
    border-radius:10px; padding:8px 10px; margin-bottom:6px; }
  .exp-field-row input[type=checkbox]{ width:18px; height:18px; accent-color:var(--acc); }
  .exp-field-name{ flex:1; font-size:14px; color:var(--txt); }
  .exp-field-mv{ display:flex; gap:4px; }

  /* 笔记：紧凑符号栏 + 大输入框 + 搜索/标签/排序/多选 + 操作菜单 */
  body.notes-mode{ padding-bottom:0; }
  body.notes-mode .wrap{ padding-bottom:200px; }
  .note-tools{ display:flex; gap:8px; margin-bottom:8px; align-items:center; }
  .note-q{ flex:1; min-width:0; background:var(--card2); border:1px solid var(--line); border-radius:10px;
    color:var(--txt); padding:9px 12px; font-size:14px; }
  .note-tools select{ flex:none; background:var(--card2); color:var(--txt); border:1px solid var(--line);
    border-radius:10px; padding:9px 6px; font-size:13px; max-width:110px; }
  .note-msel-btn{ flex:none; background:var(--card2); color:var(--txt); border:1px solid var(--line);
    border-radius:10px; padding:9px 12px; font-size:13px; font-weight:600; cursor:pointer; }
  .note-msel-btn.on{ background:var(--acc); color:#001; border-color:var(--acc); }
  .note-tagbar{ display:flex; gap:6px; overflow-x:auto; padding-bottom:8px; -webkit-overflow-scrolling:touch; }
  .note-tagbar::-webkit-scrollbar{ display:none; }
  .tag-chip{ flex:none; padding:5px 12px; background:var(--chip); border-radius:16px; font-size:13px;
    color:var(--acc); cursor:pointer; white-space:nowrap; }
  .tag-chip.on{ background:var(--acc); color:#001; font-weight:600; }
  .tag-chip.all{ color:var(--sub); }
  .note-item{ background:var(--card2); border-radius:12px; margin-bottom:10px; overflow:hidden;
    border:1px solid transparent; }
  .note-item.sel{ border-color:var(--acc); background:rgba(79,195,247,.08); }
  .note-item .group-head{ padding:12px 14px 4px; cursor:pointer; }
  .note-item .npv{ padding:0 14px 2px; color:var(--sub); font-size:13px; line-height:1.6;
    overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .note-item .ntags{ display:flex; flex-wrap:wrap; gap:6px; padding:4px 14px 12px; }
  .ntag{ background:var(--chip); color:var(--acc); border-radius:6px; padding:1px 8px; font-size:12px; }
  .note-chk{ flex:none; width:22px; height:22px; border-radius:7px; border:2px solid var(--sub);
    display:flex; align-items:center; justify-content:center; color:#001; font-size:14px; font-weight:700; }
  .note-chk.on{ background:var(--acc); border-color:var(--acc); }
  .note-composer{ position:fixed; bottom:0; left:0; right:0; max-width:560px; margin:0 auto;
    background:var(--card); border-top:1px solid var(--line); border-radius:14px 14px 0 0;
    padding:8px 12px calc(8px + env(safe-area-inset-bottom)); z-index:45; }
  .nc-toolbar{ display:flex; gap:6px; margin-bottom:6px; }
  .nc-sym{ flex:none; width:38px; padding:5px 0; background:var(--card2); color:var(--acc);
    border:1px solid var(--line); border-radius:8px; font-size:14px; font-weight:600; cursor:pointer; }
  .nc-sym.tag{ background:rgba(79,195,247,.16); border-color:var(--acc); }
  .nc-sym:active{ background:var(--chip); }
  .nc-wrap{ position:relative; }
  .tag-suggest{ position:absolute; left:0; right:0; bottom:calc(100% + 6px); background:var(--card);
    border:1px solid var(--line); border-radius:12px; box-shadow:0 -4px 20px rgba(0,0,0,.5);
    overflow:hidden; z-index:50; }
  .tag-suggest .ts-title{ font-size:12px; color:var(--sub); padding:8px 12px 4px; }
  .tag-suggest .ts-item{ display:flex; align-items:center; gap:8px; padding:10px 12px; font-size:14px;
    color:var(--acc); cursor:pointer; border-top:1px solid var(--line); }
  .tag-suggest .ts-item .ts-cnt{ margin-left:auto; color:var(--sub); font-size:12px; }
  .tag-suggest .ts-item.cur{ background:var(--card2); }
  .nc-row{ display:flex; gap:8px; align-items:flex-end; }
  .nc-row textarea{ flex:1; background:var(--bg); border:1px solid var(--line); border-radius:12px;
    color:var(--txt); padding:12px 14px; font-size:15px; line-height:1.6; resize:none;
    min-height:76px; max-height:200px; }
  .nc-send{ flex:none; background:var(--acc); color:#001; border:none; border-radius:12px;
    padding:0 18px; height:44px; font-size:15px; font-weight:700; cursor:pointer; }
  .nc-send:active{ opacity:.85; }
  .msel-bar{ position:fixed; bottom:0; left:0; right:0; max-width:560px; margin:0 auto;
    background:var(--card); border-top:1px solid var(--line); border-radius:14px 14px 0 0;
    padding:10px 12px calc(10px + env(safe-area-inset-bottom)); z-index:45;
    display:flex; gap:6px; align-items:center; }
  .msel-bar .msel-cnt{ flex:1; font-size:13px; color:var(--sub); white-space:nowrap; }
  .msel-bar .btn{ flex:none; padding:10px 12px; font-size:13px; border-radius:10px; margin:0; }
  .sheet-mask{ position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:80; opacity:0;
    pointer-events:none; transition:opacity .2s; }
  .sheet-mask.show{ opacity:1; pointer-events:auto; }
  .action-sheet{ position:fixed; left:0; right:0; bottom:0; max-width:560px; margin:0 auto;
    background:var(--card); border-radius:18px 18px 0 0; z-index:81; transform:translateY(105%);
    transition:transform .25s ease; padding:14px 14px calc(14px + env(safe-area-inset-bottom)); }
  .action-sheet.show{ transform:translateY(0); }
  .as-head{ padding:2px 2px 12px; border-bottom:1px solid var(--line); margin-bottom:8px; }
  .as-title{ font-size:15px; font-weight:700; }
  .as-sub{ color:var(--sub); font-size:12px; margin-top:4px; line-height:1.5;
    overflow:hidden; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; }
  .as-tags{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .as-tag{ background:var(--chip); color:var(--acc); border-radius:6px; padding:2px 9px; font-size:12px; cursor:pointer; }
  .as-actions{ display:flex; flex-direction:column; gap:8px; }
  .as-actions .btn{ padding:13px; font-size:15px; border-radius:12px; margin:0; }
  .as-cancel{ margin-top:2px; }
  .note-actions{ display:flex; gap:10px; margin-top:12px; }
  .note-actions .btn{ padding:12px; font-size:14px; }

  /* HIIT 阶段徽标 + 爬楼组间休息条 */
  .phase-badge{ text-align:center; font-size:15px; font-weight:700; border-radius:10px; padding:8px; margin-bottom:8px; }
  .phase-badge.work{ background:rgba(79,195,247,.15); color:var(--acc); }
  .phase-badge.rest{ background:rgba(46,158,91,.15); color:var(--acc2); }
  .rest-bar{ background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-top:12px;
    display:flex; align-items:center; gap:10px; }
  .rest-bar .rb-time{ font-size:26px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--acc2); min-width:92px; }
  .rest-bar .rb-info{ flex:1; color:var(--sub); font-size:13px; line-height:1.5; }
  .rest-bar .rb-info b{ color:var(--acc2); font-size:15px; }
  .rest-bar.done{ border-color:var(--warn); }
  .rest-bar.done .rb-time{ color:var(--warn); }
  .rest-bar .btn{ flex:none; padding:10px 12px; font-size:13px; margin:0; }
  .phase-badge.setRest{ background:rgba(255,167,38,.15); color:#ffa726; }
  .hiit-progress{ height:8px; background:var(--card2); border-radius:4px; margin:10px 0; overflow:hidden; }
  .hiit-progress .fill{ height:100%; border-radius:4px; transition:width .2s; }
  .hiit-progress .fill.work{ background:var(--acc); }
  .hiit-progress .fill.rest{ background:var(--acc2); }
  .hiit-progress .fill.setRest{ background:#ffa726; }
  .stair-floors-big{ font-size:56px; font-weight:700; text-align:center; color:var(--acc); margin:4px 0; font-variant-numeric:tabular-nums; }
  .stair-kcal{ text-align:center; color:var(--sub); font-size:14px; margin-bottom:10px; }
  .floor-btns{ display:flex; gap:8px; margin:10px 0; }
  .floor-btns button{ flex:1; padding:14px 6px; border:1px solid var(--line); background:var(--card2); color:var(--acc); border-radius:10px; font-size:15px; font-weight:600; cursor:pointer; }
  .floor-btns button:active{ background:var(--chip); }
  /* 铃声按场景设置 */
  .sound-scene-list{ margin-top:8px; }
  .sound-scene-row{ display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
  .sound-scene-name{ flex:1; font-size:14px; color:var(--txt); }
  .sound-scene-select{ padding:7px 10px; border:1px solid var(--line); border-radius:8px; background:var(--card2); color:var(--txt); font-size:13px; min-width:130px; }
</style>
</head>
<body>
<div class="topbar">
  <button class="tb-btn" onclick="openSidebar()" aria-label="菜单">☰</button>
  <div class="tb-title">🏋️ 健身训练记录<span id="app-version" class="tb-ver"></span></div>
  <div class="tb-spacer" aria-hidden="true"></div>
</div>
<div class="backdrop" id="backdrop" onclick="closeSidebar()"></div>
<aside class="sidebar" id="sidebar">
  <div class="sb-head">
    <div class="sb-title">🏋️ 健身训练记录</div>
    <button class="tb-btn" onclick="closeSidebar()" aria-label="关闭">✕</button>
  </div>
  <nav class="sb-nav">
    <button data-tab="train" onclick="goTab('train')">⏱ 训练</button>
    <button data-tab="hiit" onclick="goTab('hiit')">🔥 HIIT</button>
    <button data-tab="stair" onclick="goTab('stair')">🧗 爬楼</button>
    <button data-tab="notes" onclick="goTab('notes')">📝 笔记</button>
    <button data-tab="settings" onclick="goTab('settings')">⚙ 设置</button>
  </nav>
  <div class="sb-stats" id="sb-stats"></div>
  <div class="sb-foot">数据保存在本机 · 无需联网</div>
</aside>
<div class="wrap" id="app"></div>
<div class="sheet-mask" id="sheet-mask" onclick="closeNoteSheet()"></div>
<div class="action-sheet" id="action-sheet"></div>

<script>
/* ============ 预设 ============ */
const PARTS = ['胸','背','腿','肩','腹'];
const ACTIONS = {
  '胸':['杠铃卧推','哑铃卧推','上斜卧推','飞鸟','双杠臂屈伸'],
  '背':['引体向上','高位下拉','杠铃划船','单臂划船','硬拉'],
  '腿':['深蹲','半蹲','器械深蹲','腿举','箭步蹲','罗马尼亚硬拉'],
  '肩':['哑铃推举','侧平举','前平举','俯身飞鸟','耸肩'],
  '腹':['悬挂举腿','山羊挺身','卷腹','平板支撑','悬垂提膝'],
};
const REST_OPTIONS = [30,45,60,90,120,150,180,240,300];

/* ============ 工具 ============ */
const $=id=>document.getElementById(id);
function fmt(ms){ const s=Math.floor(ms/1000); const m=Math.floor(s/60); return String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function fmtRest(sec){ if(!sec) return ''; if(sec>=60 && sec%60===0) return `休息${sec/60}分钟，`; return `休息${sec}秒，`; }
/* 统一格式：休息x，[部位] 动作 重量*次数下，笔记（来自笔记） */
function fmtRecordLine(r){
  const rest = fmtRest(r.rest);
  const part = r.part ? `[${r.part}] ` : '';
  const action = r.action || '';
  const repsNum = String(r.reps||'').replace(/rm$/i,'');
  let detail='';
  if(r.weight && repsNum) detail = ` ${r.weight}kg*${repsNum}下`;
  else if(repsNum) detail = ` ${repsNum}下`;
  else if(r.weight) detail = ` ${r.weight}kg`;
  const note = r.note ? `，${r.note}（来自笔记）` : '';
  return `${rest}${part}${action}${detail}${note}`.replace(/\s+$/,'');
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,5); }
function today(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function nowTime(){ const d=new Date(); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }

/* ============ 状态 ============ */
let state = {
  tab:'train',
  trainSub:'timer',
  mode:'countup',
  running:false,
  elapsed:0,
  cdTotal:180,
  cdLeft:180,
  startedAt:0,
  lastLapAt:0,
  groups:[],          // {idx,cumul,split,part,action,reps,weight,note,rest,t}
  editingIdx:null,
  records:[],         // {id,date,t,part,action,rest,reps,weight,note,src}
  exportCfg: { order:['date','time','set','part','action','reps','weight','rest','note'], off:[], delim:'comma', header:true }, // 导出记录格式：字段顺序 + 分隔符
};
let showManual = false;
let recDraft = { part:'', action:'', rest:60, reps:'', weight:'', note:'', t:'' };
const LS = 'fitness_records_v5';
let groupDefaults = { part:'', action:'', reps:'', weight:'' };

function load(){ try{ const d=JSON.parse(localStorage.getItem(LS)||'{}');
  if(d.records) state.records=d.records; if(d.groups) state.groups=d.groups;
  if(d.defaults) groupDefaults=Object.assign(groupDefaults, d.defaults);
  if(d.showManual!=null) showManual=d.showManual;
  if(d.recDraft) recDraft=Object.assign(recDraft, d.recDraft);
  if(d.exportCfg) state.exportCfg=sanitizeExportCfg(d.exportCfg);
  // 恢复上次选择的倒计时时长（空闲态，倒计时回到完整时长）
  if(d.cdTotal){ const cd=parseInt(d.cdTotal,10); if(!isNaN(cd) && cd>0 && cd<=3600){ state.cdTotal=cd; state.cdLeft=cd; } }
  // 兼容旧组：补上 rest / t
  state.groups.forEach(g=>{ if(g.rest==null) g.rest=Math.round((g.split||0)/1000); if(!g.t) g.t=nowTime(); });
}catch(e){} }
function persist(){ localStorage.setItem(LS, JSON.stringify({records:state.records, groups:state.groups, defaults:groupDefaults, showManual, recDraft, cdTotal:state.cdTotal, exportCfg:state.exportCfg})); }

/* ============ 组命名：动作+第N组，换动作重新数 ============ */
function actionGroupNo(g){
  let n=0;
  for(const x of state.groups){ if(x.action && x.action===g.action) n++; if(x===g) return n; }
  return 0;
}
function groupLabel(g){
  const i = state.groups.indexOf(g);
  if(g.action) return `${g.action} 第${actionGroupNo(g)}组`;
  return `第${i+1}组`;
}
function groupDetail(g){
  const p = g.part ? `[${g.part}] ` : '';
  const parts=[];
  if(g.reps) parts.push(String(g.reps).match(/rm$/i)? g.reps : g.reps+'rm');
  if(g.weight) parts.push(g.weight+'kg');
  if(g.rest) parts.push(fmtRest(g.rest).replace(/，$/,''));
  if(g.note) parts.push(g.note);
  return p + parts.join(' ');
}

/* ============ 计时器核心 ============ */
let timerId=null;
function tick(){
  const now=Date.now();
  if(state.mode==='countup'){
    if(state.running) state.elapsed = now - state.startedAt;
    setTime(fmt(state.elapsed), `累计训练时长 · 已记 ${state.groups.length} 组`);
  } else {
    const passed = (now - state.startedAt)/1000;
    state.cdLeft = Math.max(0, state.cdTotal - passed);
    const passedMs = (state.cdTotal - state.cdLeft)*1000;
    setTime(fmt(state.cdLeft*1000), `倒计时剩余 · 已用时 ${fmt(passedMs)}${state.cdTotal?` / 总计 ${fmt(state.cdTotal*1000)}`:''}`);
    if(state.cdLeft<=0 && state.running){ finishCountdown(); Native.fireFinish(state.cdTotal); }
  }
}
function setTime(disp, sub){
  const el=$('time-display'), sb=$('time-sub');
  if(el) el.textContent=disp; if(sb) sb.textContent=sub;
}
function startTimer(){
  if(state.mode==='countdown'){
    if(state.cdTotal<=0){ state.cdTotal=60; state.cdLeft=60; }  // 防御：时长不能为 0（0 秒会瞬间触发系统闹钟，甚至崩溃）
    if(state.cdLeft<=0) state.cdLeft=state.cdTotal;              // 已归零 → 从头开始，而不是从 0 继续
  }
  state.running=true;
  state.startedAt = Date.now() - (state.mode==='countup'? state.elapsed : (state.cdTotal-state.cdLeft)*1000);
  if(state.lastLapAt===0) state.lastLapAt = state.mode==='countup'? state.elapsed : 0;
  if(state.mode==='countdown' && state.cdTotal>0) Native.scheduleCountdown(state.cdTotal, state.startedAt + state.cdTotal*1000);
  timerId = setInterval(tick, 200);
  renderTimer();
}
function pauseTimer(){ if(state.mode==='countdown' && state.running) Native.cancelCountdown(); state.running=false; clearInterval(timerId); renderTimer(); }
function resetTimer(){
  if(state.mode==='countdown') Native.cancelCountdown();
  state.running=false; clearInterval(timerId);
  state.elapsed=0; state.cdLeft=state.cdTotal; state.lastLapAt=0;
  renderTimer();
}
function setMode(m){
  if(state.running) pauseTimer();
  state.mode=m;
  if(m==='countup'){ state.elapsed=0; state.lastLapAt=0; }
  else { state.cdLeft=state.cdTotal; state.lastLapAt=0; }
  renderTimer();
}
/* 供安卓原生弹窗「再休息 X 分钟」回调：切到倒计时并启动 */
window.restartCountdown = function(seconds){
  seconds = parseInt(seconds)||60;
  state.cdTotal = seconds;
  persist();
  setMode('countdown');
  startTimer();
};
function getCurrent(){ return state.mode==='countup'? state.elapsed : (state.cdTotal-state.cdLeft)*1000; }

/* 新增一组（正计时/倒计时共用），自动继承上一组动作，并记录当前时间 */
function addGroup(extra){
  const cur = getCurrent();
  let split = state.lastLapAt ? cur - state.lastLapAt : cur;
  if(split<0) split=0;   // lastLapAt 跨模式残留时禁止出现负值
  const g = Object.assign({
    idx: state.groups.length+1, cumul:cur, split:split,
    part:groupDefaults.part, action:groupDefaults.action,
    reps:groupDefaults.reps, weight:groupDefaults.weight,
    note:'', rest: Math.round(split/1000), t: nowTime(), done:false
  }, extra||{});
  if(g.rest==null) g.rest=Math.round((g.split||0)/1000);
  if(g.rest<0) g.rest=0;
  if(g.split<0) g.split=0;
  state.groups.push(g);
  state.lastLapAt = cur;
  state.editingIdx = state.groups.length-1;
  persist(); renderTimer();
}
function lap(){
  const cur = getCurrent();
  if(state.mode==='countup' && !state.running && cur===0){ startTimer(); return; }  // 正计时未开始→先启动
  if(state.mode==='countdown' && cur===0){
    // 倒计时未开始：不自动启动，只把当前倒计时时长记进这一组
    addGroup({ split: state.cdTotal*1000, rest: state.cdTotal });
    return;
  }
  addGroup({});
}
/* 倒计时休息结束 → 直接并入同一份组记录，并自动选上一组动作 + 记录此刻时间 */
/* 原生系统闹钟到点（锁屏/后台路径）：同步页面为「已归零」；前台已处理则无操作 */
window.onNativeCountdownFinish = function(rest){
  if(state.mode!=='countdown' || state.cdLeft<=0) return;
  state.cdLeft=0; state.running=false; clearInterval(timerId);
  renderTimer();
};
function recordRestGroup(){
  Native.dismiss();                 // 关掉锁屏弹窗 / 停止震动
  Native.cancelCountdown();         // 取消系统闹钟（若有）
  const restSec = Math.round(state.cdTotal);
  const restMs = restSec*1000;
  addGroup({ split:restMs, rest:restSec, cumul: state.elapsed + restMs });
  // 记录完回到正计时，准备下一组
  state.mode='countup';
  state.elapsed=0; state.cdLeft=state.cdTotal; state.lastLapAt=0;
  state.running=false; clearInterval(timerId);
  renderTimer();
}
function finishCountdown(){ state.running=false; clearInterval(timerId); renderTimer(); }

/* ============ 组编辑 ============ */
function updateGroup(idx, patch){ Object.assign(state.groups[idx], patch);
  ['part','action','reps','weight'].forEach(k=>{ if(patch[k]!==undefined) groupDefaults[k]=patch[k]; });
  persist(); renderTimer(); }
function toggleEdit(i){ state.editingIdx = state.editingIdx===i? null : i; renderTimer(); }
function closeEdit(){ state.editingIdx=null; renderTimer(); }
function pickPart(i,p){ updateGroup(i,{part:p, action:''}); }
function pickAction(i,a){ updateGroup(i,{action:a}); }
function removeGroup(i){ state.groups.splice(i,1); state.groups.forEach((g,idx)=>g.idx=idx+1); state.editingIdx=null; persist(); renderTimer(); }
function setCdMin(v){ const t=Math.max(5, parseInt(v)*60 + (state.cdTotal%60)); state.cdTotal=t; state.cdLeft=state.cdTotal; persist(); renderTimer(); }
function setCdSec(v){ const t=Math.max(5, Math.floor(state.cdTotal/60)*60 + parseInt(v)); state.cdTotal=t; state.cdLeft=state.cdTotal; persist(); renderTimer(); }

function saveGroupsToHistory(){
  const valid = state.groups.filter(g=>g.part || g.action || g.reps || g.note);
  if(valid.length===0){ alert('还没有填写任何组哦（至少选个动作）'); return; }
  valid.forEach(g=>{
    state.records.unshift({ id:uid(), date:today(), t:g.t||nowTime(), src:'timer',
      part:g.part, action:g.action, rest:g.rest!=null? g.rest : Math.round(g.split/1000),
      reps:g.reps, weight:g.weight, note:g.note });
  });
  state.groups=[]; state.editingIdx=null;
  persist(); renderTrain();
}

/* ============ 焦点保持（防止输入时软键盘收回）============ */
let _focus = null;
function captureFocus(){
  const a = document.activeElement;
  if(!a || !a.dataset || !a.dataset.fid || !a.closest('#app')){ _focus=null; return; }
  let start=null, end=null; try{ start=a.selectionStart; end=a.selectionEnd; }catch(e){}
  // 个别浏览器/输入类型读不到光标位置时，回退为“光标放末尾”，避免跳到开头把数字打反
  if(start==null || end==null){ start=(a.value||'').length; end=start; }
  _focus = { fid:a.dataset.fid, start, end };
}
function restoreFocus(){
  if(!_focus) return;
  const f=_focus; _focus=null;
  const el = document.querySelector('#app [data-fid="'+f.fid+'"]');
  if(!el) return;
  el.focus();
  try{ el.setSelectionRange(f.start, f.end); }
  catch(e){ try{ const L=(el.value||'').length; el.setSelectionRange(L,L); }catch(_){} }
}

/* ============ 渲染：计时器（含记录/历史）============ */
function renderGroupEdit(i){
  const g=state.groups[i];
  const fid=id=> `data-fid="g-${i}-${id}"`;
  return `<div class="group-edit">
    <div class="field-label">部位</div>
    <div class="chips">${PARTS.map(p=>`<span class="chip ${g.part===p?'on':''}" onclick="pickPart(${i},'${p}')">${p}</span>`).join('')}</div>
    <div class="field-label">动作（点选预设，也可自己打）</div>
    <div class="chips">${(ACTIONS[g.part]||[]).map(a=>`<span class="chip ${g.action===a?'on':''}" onclick="pickAction(${i},'${a}')">${a}</span>`).join('')}</div>
    <input class="inline-input" ${fid('action')} placeholder="或手动输入动作，如：器械深蹲" value="${g.action||''}" oninput="updateGroup(${i},{action:this.value})">
    <div class="row2" style="margin-top:10px">
      <div style="flex:1"><div class="field-label">次数 (RM)</div>
        <input class="inline-input" type="text" inputmode="numeric" ${fid('reps')} placeholder="7" value="${g.reps||''}" oninput="updateGroup(${i},{reps:this.value})"></div>
      <div style="flex:1"><div class="field-label">重量 kg</div>
        <input class="inline-input" type="text" inputmode="numeric" ${fid('weight')} placeholder="100" value="${g.weight||''}" oninput="updateGroup(${i},{weight:this.value})"></div>
    </div>
    <div class="field-label">休息时间（秒，可手动填 / 点选预设）</div>
    <input class="inline-input" type="text" inputmode="numeric" min="0" ${fid('rest')} placeholder="180" value="${g.rest||''}" oninput="updateGroup(${i},{rest:parseInt(this.value)||0})">
    <div class="chips" style="margin-top:8px">${REST_OPTIONS.slice(0,7).map(r=>`<span class="chip ${g.rest==r?'on':''}" onclick="updateGroup(${i},{rest:${r}})">${r}秒</span>`).join('')}</div>
    <div class="field-label">笔记（如：好酸 / 状态不错）</div>
    <input class="inline-input" ${fid('note')} placeholder="可选" value="${g.note||''}" oninput="updateGroup(${i},{note:this.value})">
    <div class="edit-actions">
      <button class="btn btn-green" onclick="closeEdit()">✔ 完成</button>
      <button class="btn btn-ghost" onclick="removeGroup(${i})">删除这组</button>
    </div>
  </div>`;
}

/* ============ 训练页（计时器 + 导出 合并为一个界面）============ */
function setTrainSub(sub){ state.trainSub=sub; renderTrain(); }
function renderTrain(){
  captureFocus();
  const sub=state.trainSub;
  let html=`<h2>🏋️ 训练</h2>
    <div class="mode-toggle">
      <button class="${sub==='timer'?'on':''}" onclick="setTrainSub('timer')">⏱ 计时器</button>
      <button class="${sub==='export'?'on':''}" onclick="setTrainSub('export')">📤 导出</button>
    </div>`;
  html += sub==='export' ? renderExportContent() : renderTimerContent();
  $('app').innerHTML=html;
  restoreFocus();
}
function renderTimer(){ if(state.tab==='train') renderTrain(); }
function renderTimerContent(){
  const s=state;
  let html=`<div class="card">`;
  html+=`<div class="mode-toggle">
    <button class="${s.mode==='countup'?'on':''}" onclick="setMode('countup')">▶ 正计时（训练）</button>
    <button class="${s.mode==='countdown'?'on':''}" onclick="setMode('countdown')">⏳ 倒计时（休息）</button>
  </div>`;

  if(s.mode==='countdown'){
    html+=`<div class="dur-set"><span style="color:var(--sub)">时长</span>
      <select onchange="setCdMin(this.value)">${[0,1,2,3,5,10,15,20,25,30].map(m=>`<option ${s.cdTotal/60==m?'selected':''}>${m}</option>`).join('')}</select> 分
      <select onchange="setCdSec(this.value)">${[0,15,30,45].map(sec=>`<option ${s.cdTotal%60==sec?'selected':''}>${sec}</option>`).join('')}</select> 秒
    </div>`;
  }

  if(s.mode==='countup'){
    html+=`<div class="time-display" id="time-display">${fmt(s.elapsed)}</div>
      <div class="time-sub" id="time-sub">累计训练时长 · 已记 ${s.groups.length} 组</div>`;
  } else {
    const passedMs = (s.cdTotal - s.cdLeft)*1000;
    html+=`<div class="time-display" id="time-display">${fmt(s.cdLeft*1000)}</div>
      <div class="time-sub" id="time-sub">倒计时剩余 · 已用时 ${fmt(passedMs)}${s.cdTotal?` / 总计 ${fmt(s.cdTotal*1000)}`:''}</div>`;
  }

  if(s.running){
    html+=`<div class="btn-row">
      <button class="btn btn-stop" onclick="pauseTimer()">⏸ 暂停</button>
      <button class="btn btn-ghost" onclick="resetTimer()">↺ 重置</button>
    </div>`;
  } else {
    html+=`<div class="btn-row">
      <button class="btn btn-primary" onclick="startTimer()">${s.elapsed>0||(s.mode==='countdown'&&s.cdLeft>0&&s.cdLeft<s.cdTotal)?'▶ 继续':'▶ 开始'}</button>
      <button class="btn btn-ghost" onclick="resetTimer()">↺ 重置</button>
    </div>`;
  }

  html+=`<button class="set-btn" onclick="lap()">＋ 记一组</button>`;

  if(s.mode==='countdown' && !s.running && s.cdLeft<=0){
    html+=`<div class="finish-bar" onclick="recordRestGroup()">⏰ 休息结束 · 记录这组 →</div>`;
  }
  html+=`</div>`;

  // ★ 组记录列表（正计时 / 倒计时 共享同一份）
  {
    html+=`<div class="group-hint"><span>本次组别（点击任一组填写动作/笔记）</span>`;
    if(s.groups.length>0) html+=`<span class="save-all" onclick="saveGroupsToHistory()">保存到记录 ↓</span>`;
    html+=`</div>`;
    if(s.groups.length===0){
      html+=`<div class="empty">做完一组点「＋ 记一组」，这里会累积记录<br>每组都能点开编辑</div>`;
    } else {
      [...s.groups].reverse().forEach(g=>{
        const realIdx = state.groups.indexOf(g);
        const edited = g.part || g.action || g.reps || g.weight || g.note;
        const detail = groupDetail(g);
        html+=`<div class="group-item">
          <div class="group-head ${edited?'edited':''}" onclick="toggleEdit(${realIdx})">
            <span class="gidx">${groupLabel(g)}</span>
            <span class="gtime">${g.t||''}</span>
            <span class="gsplit">+${fmt(g.split)}</span>
            <span class="gsummary">${edited? (detail||g.action||'已记录') : '<span style="color:var(--sub)">点击填写动作</span>'}</span>
            <span class="garrow">${state.editingIdx===realIdx?'▴':'▾'}</span>
          </div>`;
        if(state.editingIdx===realIdx) html+= renderGroupEdit(realIdx);
        html+=`</div>`;
      });
    }
  }

  html += renderRecordSection();
  return html;
}

/* ============ 记录区（手动补录 + 历史）============ */
function recPreviewText(){
  const d=recDraft;
  const timeTxt = d.t? d.t+' ' : '';
  const restTxt = fmtRest(d.rest);
  const rmTxt = d.reps? (String(d.reps).match(/rm$/i)? d.reps : d.reps+'rm') : '';
  const wTxt = d.weight? d.weight+'kg' : '';
  const main = [d.action, rmTxt, wTxt, d.note].filter(Boolean).join(' ');
  return (d.part||main)? `${timeTxt}${restTxt}${d.part? '['+d.part+'] ' : ''}${main}` : '休息3分钟，器械深蹲 7rm';
}
function updateRecPreview(){ const prev=$('rec-preview'); if(prev) prev.textContent=recPreviewText(); }

function renderRecordSection(){
  const d=recDraft;
  let html=`<div class="section-title">📝 记录（手动补录 + 历史，与计时器同一份）</div>`;

  if(showManual){
    html+=`<div class="card">
      <div class="rec-head">
        <span class="rh-title">✏️ 手动补录 <span style="color:var(--sub);font-weight:400;font-size:12px">· 当前 ${nowTime()}</span></span>
        <button class="rh-close" onclick="toggleManual()">收起 ▴</button>
      </div>
      <div class="row2">
        <div style="flex:1"><div class="field-label">记录时间</div>
          <input class="inline-input" type="time" value="${d.t||nowTime()}" oninput="recDraft.t=this.value;updateRecPreview()"></div>
        <div style="flex:1"><div class="field-label">休息（秒，可手动填）</div>
          <input class="inline-input" type="text" inputmode="numeric" min="0" placeholder="180" value="${d.rest||''}" oninput="recDraft.rest=parseInt(this.value)||0;updateRecPreview()"></div>
      </div>
      <div class="chips" style="margin-top:8px">${REST_OPTIONS.map(r=>`<span class="chip ${d.rest==r?'on':''}" onclick="recDraft.rest=${r};renderTimer()">${fmtRest(r)||r+'秒'}</span>`).join('')}</div>
      <div class="field-label">部位</div>
      <div class="chips">${PARTS.map(p=>`<span class="chip ${d.part===p?'on':''}" onclick="recPickPart('${p}')">${p}</span>`).join('')}</div>
      <div class="field-label">动作</div>
      <div class="chips">${(ACTIONS[d.part]||[]).map(a=>`<span class="chip ${d.action===a?'on':''}" onclick="recPickAction('${a}')">${a}</span>`).join('')}</div>
      <input class="inline-input" placeholder="或自己输入，如：器械深蹲" value="${d.action||''}" oninput="recDraft.action=this.value;updateRecPreview()">
      <div class="row2" style="margin-top:12px">
        <div style="flex:1"><div class="field-label">次数(RM)</div>
          <input class="inline-input" type="text" inputmode="numeric" placeholder="7" value="${d.reps||''}" oninput="recDraft.reps=this.value;updateRecPreview()"></div>
        <div style="flex:1"><div class="field-label">重量(kg)</div>
          <input class="inline-input" type="text" inputmode="numeric" placeholder="100" value="${d.weight||''}" oninput="recDraft.weight=this.value;updateRecPreview()"></div>
      </div>
      <div class="field-label">笔记</div>
      <input class="inline-input" placeholder="好酸" value="${d.note||''}" oninput="recDraft.note=this.value;updateRecPreview()">
      <div class="preview" id="rec-preview">${recPreviewText()}</div>
      <button class="btn btn-green" style="width:100%" onclick="addManual()">＋ 加入记录</button>
    </div>`;
  } else {
    html+=`<button class="btn btn-ghost" style="width:100%;margin-bottom:14px" onclick="toggleManual()">＋ 手动补录一条</button>`;
  }

  html+=`<div class="section-title">记录历史</div>`;
  if(state.records.length===0){ html+=`<div class="empty">还没有记录，去做第一组吧 💪</div>`; }
  else {
    let lastDate='';
    state.records.forEach(r=>{
      if(r.date!==lastDate){ html+=`<div class="hist-date">📅 ${r.date}</div>`; lastDate=r.date; }
      const line = fmtRecordLine(r);
      html+=`<div class="hist-item">
        <span class="h-time">${r.t}</span>
        <span class="h-body">${line}</span>
        <button class="del" onclick="delRecord('${r.id}')">×</button>
      </div>`;
    });
  }
  return html;
}
function toggleManual(){ showManual=!showManual; persist(); renderTimer(); }
function recPickPart(p){ recDraft.part=p; if(!(ACTIONS[p]||[]).includes(recDraft.action)) recDraft.action=''; persist(); renderTimer(); }
function recPickAction(a){ recDraft.action=a; persist(); renderTimer(); }
function addManual(){
  const d=recDraft;

function collectExportItems(){
  const items=[];
  state.groups.forEach((g,i)=>{
    if(!(g.part||g.action||g.reps||g.note)) return;
    items.push({ date:today(), set:i+1, t:g.t||'', rest:g.rest!=null? g.rest : Math.round(g.split/1000), part:g.part||'', action:g.action||'', reps:g.reps||'', weight:g.weight==null? '' : g.weight, note:g.note||'' });
  });
  state.records.forEach(r=> items.push({ date:r.date, set:'', t:r.t||'', rest:r.rest||0, part:r.part||'', action:r.action||'', reps:r.reps||'', weight:r.weight==null? '' : r.weight, note:r.note||'' }));
  return items;
}
function sortItems(items){
  return items.slice().sort((a,b)=> (a.date<b.date?-1:a.date>b.date?1:0) || (a.t||'').localeCompare(b.t||''));
}
function escHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function sanitizeExportCfg(c){
  c=c||{};
  const known=Object.keys(FIELD_META);
  let order=Array.isArray(c.order)? c.order.filter(k=>known.includes(k)) : [];
  known.forEach(k=>{ if(!order.includes(k)) order.push(k); });   // 补全缺失字段
  const off=Array.isArray(c.off)? c.off.filter(k=>known.includes(k)) : [];
  return {
    order, off,
    delim: DELIM_OPTIONS.some(o=>o.k===c.delim)? c.delim : 'comma',
    custom: typeof c.custom==='string'? c.custom : '',
    header: c.header!==false
  };
}
function resolveDelim(cfg){
  cfg=cfg||state.exportCfg;
  const opt=DELIM_OPTIONS.find(o=>o.k===cfg.delim);
  if(!opt) return ',';
  if(cfg.delim==='custom') return cfg.custom||',';
  return opt.v;
}
function cellEsc(v, delim){
  v=String(v==null?'':v);
  return (v.indexOf(delim)>=0 || v.indexOf('"')>=0 || /[\r\n]/.test(v)) ? '"'+v.replace(/"/g,'""')+'"' : v;
}
function buildExport(){
  const cfg=sanitizeExportCfg(state.exportCfg);
  const delim=resolveDelim(cfg);
  const fields=cfg.order.filter(k=>!cfg.off.includes(k));
  if(fields.length===0) return '（未选择任何字段，请到「设置 → 导出记录格式」勾选）';
  const items=sortItems(collectExportItems());
  const lines=[];
  if(cfg.header) lines.push(fields.map(k=>FIELD_META[k].label).join(delim));
  items.forEach(r=> lines.push(fields.map(k=>cellEsc(r[k], delim)).join(delim)));
  return lines.length? lines.join('\n') : '（暂无记录）';
}
function fmtExportCfg(){
  const cfg=sanitizeExportCfg(state.exportCfg);
  const opt=DELIM_OPTIONS.find(o=>o.k===cfg.delim)||DELIM_OPTIONS[0];
  const fields=cfg.order.filter(k=>!cfg.off.includes(k));
  const fieldStr=fields.map(k=>FIELD_META[k].label).join('、')||'（未选择字段）';
  return `分隔符：${opt.label} · 字段顺序：${fieldStr} · ${cfg.header? '首行含字段名':'无表头'}`;
}

function exportToNoteAndReset(){
  if(state.groups.length===0){ alert('计时器里还没有记任何组，先点「＋ 记一组」吧'); return; }
  if(!confirm('确认把本次训练导出到笔记，并重置计时器？\n导出后计时器与本次组别将被清空。')) return;
  const lines=[];
  lines.push('训练时长：' + fmt(state.elapsed));

    } else {
      lines.push((i+1) + '. 第' + (i+1) + '组 · ' + (g.t||'') + ' · +' + fmt(g.split));

/* ============ HIIT 页（组/轮/组间休息结构 + 阶段提醒 + 导出）============ */
const HIIT_LS = 'fitness_hiit_v2';
const HIIT_PRESETS = [
  { name:'Tabata',    work:20,  rest:10,  rounds:8,  sets:1, setRest:0  },
  { name:'HIIT 30/30', work:30,  rest:30,  rounds:10, sets:1, setRest:0  },
  { name:'4x4 间歇',   work:240, rest:180, rounds:1,  sets:4, setRest:0  },
  { name:'3组×8轮',    work:30,  rest:30,  rounds:8,  sets:3, setRest:60 },
];
let hiit = {
  tab:'record',
  workSec:30, restSec:30, roundsPerSet:10, sets:3, setRestSec:60,
  running:false, finished:false,
  phase:'work',            // work | rest | setRest
  currentSet:1, currentRound:1,
  phaseLeft:30, phaseEndAt:0, timerId:null,
  startAt:0, totalElapsed:0,
  sessions:[],             // {date,t,work,rest,rounds,sets,setRest,duration}
};
function loadHiit(){ try{ const d=JSON.parse(localStorage.getItem(HIIT_LS)||'{}');
  if(Array.isArray(d.sessions)) hiit.sessions=d.sessions;
  const ws=parseInt(d.workSec,10); if(ws>0&&ws<=3600) hiit.workSec=ws;
  const rs=parseInt(d.restSec,10); if(rs>0&&rs<=3600) hiit.restSec=rs;
  const rp=parseInt(d.roundsPerSet,10); if(rp>0&&rp<=100) hiit.roundsPerSet=rp;
  const st=parseInt(d.sets,10); if(st>0&&st<=50) hiit.sets=st;
  const sr=parseInt(d.setRestSec,10); if(sr>=0&&sr<=3600) hiit.setRestSec=sr;
  hiit.running=false; hiit.finished=false; hiit.phase='work'; hiit.currentSet=1; hiit.currentRound=1;
  hiit.phaseLeft=hiit.workSec; hiit.timerId=null;
}catch(e){} }
function persistHiit(){ localStorage.setItem(HIIT_LS, JSON.stringify({sessions:hiit.sessions, workSec:hiit.workSec, restSec:hiit.restSec, roundsPerSet:hiit.roundsPerSet, sets:hiit.sets, setRestSec:hiit.setRestSec})); }

function setHiitTab(t){ hiit.tab=t; renderHiit(); }
function applyHiitPreset(i){
  if(hiit.running){ alert('训练进行中，请先重置'); return; }
  const p=HIIT_PRESETS[i];
  hiit.workSec=p.work; hiit.restSec=p.rest; hiit.roundsPerSet=p.rounds;
  hiit.sets=p.sets; hiit.setRestSec=p.setRest;
  hiitReset();
}
function setHiitParam(key,val){
  if(hiit.running){ alert('训练进行中，请先重置再调整参数'); return; }
  const v=parseInt(val,10); if(isNaN(v)||v<0) return;
  hiit[key]=Math.max(key==='setRestSec'?0:1, v);
  hiit.phaseLeft=hiit.workSec;
  persistHiit(); renderHiit();
}
function hiitOpts(list,cur){ if(!list.includes(cur)) list=[cur].concat(list).sort((a,b)=>a-b); return list; }

function hiitStart(){
  if(hiit.running){ hiitPause(); return; }
  if(hiit.finished){ hiitReset(); }
  hiit.running=true;
  hiit.startAt = Date.now() - hiit.totalElapsed;
  hiit.phaseEndAt = Date.now() + hiit.phaseLeft*1000;
  Native.scheduleCountdown(hiit.phaseLeft, hiit.phaseEndAt);
  hiit.timerId = setInterval(hiitTick, 200);
  renderHiit();
}
function hiitPause(){
  if(!hiit.running) return;
  Native.cancelCountdown();
  hiit.running=false; clearInterval(hiit.timerId);
  hiit.totalElapsed = Date.now() - hiit.startAt;
  hiit.phaseLeft = Math.max(0, Math.round((hiit.phaseEndAt - Date.now())/1000));
  renderHiit();
}
function hiitReset(){
  Native.cancelCountdown();
  hiit.running=false; hiit.finished=false; clearInterval(hiit.timerId);
  hiit.phase='work'; hiit.currentSet=1; hiit.currentRound=1;
  hiit.phaseLeft=hiit.workSec; hiit.totalElapsed=0; hiit.startAt=0;
  renderHiit();
}
function hiitSkipPhase(){
  if(!hiit.running) return;
  hiit.phaseEndAt = Date.now();   // 强制当前阶段立即结束
}
function hiitFirePhase(label){
  Native.cancelCountdown();
  const sec = hiit.phase==='work'? hiit.workSec : hiit.phase==='rest'? hiit.restSec : hiit.setRestSec;
  const st = hiit.phase==='work'? 1 : hiit.phase==='rest'? 2 : 3;
  Native.fire({ restSeconds:sec, label, at:nowTime(), soundType:st });
}
function hiitTick(){
  if(!hiit.running) return;
  hiit.phaseLeft = Math.max(0, Math.round((hiit.phaseEndAt - Date.now())/1000));
  hiitPaint();
  if(hiit.phaseLeft>0) return;

  // —— 阶段结束，切换下一阶段 ——
  if(hiit.phase==='work'){
    const isLastRound = hiit.currentRound >= hiit.roundsPerSet;
    const isLastSet   = hiit.currentSet >= hiit.sets;
    if(isLastRound && isLastSet){ hiitFinish(); return; }
    hiit.phase='rest'; hiit.phaseLeft=hiit.restSec;
    hiitFirePhase('HIIT 运动结束 · 休息 '+hiit.restSec+' 秒');
  } else if(hiit.phase==='rest'){
    if(hiit.currentRound >= hiit.roundsPerSet){
      // 本组完成
      if(hiit.currentSet < hiit.sets && hiit.setRestSec > 0){
        hiit.phase='setRest'; hiit.phaseLeft=hiit.setRestSec;
        hiitFirePhase('HIIT 第'+hiit.currentSet+'组完成 · 组间休息 '+hiit.setRestSec+' 秒');
      } else {
        hiit.currentSet++; hiit.currentRound=1;
        hiit.phase='work'; hiit.phaseLeft=hiit.workSec;
        hiitFirePhase('HIIT 开始第'+hiit.currentSet+'组');
      }
    } else {
      hiit.currentRound++;
      hiit.phase='work'; hiit.phaseLeft=hiit.workSec;
      hiitFirePhase('HIIT 休息结束 · 第'+hiit.currentRound+'轮');
    }
  } else { // setRest
    hiit.currentSet++; hiit.currentRound=1;
    hiit.phase='work'; hiit.phaseLeft=hiit.workSec;
    hiitFirePhase('HIIT 组间休息结束 · 开始第'+hiit.currentSet+'组');
  }
  hiit.phaseEndAt = Date.now() + hiit.phaseLeft*1000;
  Native.scheduleCountdown(hiit.phaseLeft, hiit.phaseEndAt);
  hiitPaint();
}
function hiitFinish(){
  hiit.running=false; hiit.finished=true; clearInterval(hiit.timerId);
  Native.cancelCountdown();
  hiit.totalElapsed = Date.now() - hiit.startAt;
  hiit.sessions.unshift({
    date:today(), t:nowTime(),
    work:hiit.workSec, rest:hiit.restSec,
    rounds:hiit.roundsPerSet, sets:hiit.sets, setRest:hiit.setRestSec,
    duration:hiit.totalElapsed,
  });
  persistHiit();
  Native.fire({ restSeconds:0, label:'HIIT 训练完成', at:nowTime(), soundType:4 });
  renderHiit();
}
function hiitPhaseLabel(){
  return hiit.phase==='work'?'🏃 运动中': hiit.phase==='rest'?'☕ 休息中':'⏳ 组间休息';
}
function hiitPhaseTotal(){
  return hiit.phase==='work'? hiit.workSec : hiit.phase==='rest'? hiit.restSec : hiit.setRestSec;
}
function hiitPaint(){
  const p=$('hiit-phase'); if(p){ p.textContent=hiitPhaseLabel(); p.className='phase-badge '+hiit.phase; }
  const t=$('hiit-time'); if(t) t.textContent=fmt(hiit.phaseLeft*1000);
  const s=$('hiit-sub'); if(s) s.textContent=`第 ${hiit.currentSet}/${hiit.sets} 组 · 第 ${hiit.currentRound}/${hiit.roundsPerSet} 轮`;
  const bar=$('hiit-bar'); if(bar){ const total=hiitPhaseTotal(); bar.style.width = total>0? Math.round((1-hiit.phaseLeft/total)*100)+'%' : '0%'; }
  const ov=$('hiit-overall'); if(ov){
    const totalPhases = hiit.sets*hiit.roundsPerSet*2 + (hiit.sets-1)*(hiit.setRestSec>0?1:0);
    let done = (hiit.currentSet-1)*hiit.roundsPerSet*2 + (hiit.currentRound-1)*2 + (hiit.phase==='rest'||hiit.phase==='setRest'?1:0);
    if(hiit.currentSet>1 && hiit.setRestSec>0) done += (hiit.currentSet-1);
    ov.style.width = Math.min(100, Math.round(done/totalPhases*100))+'%';
  }
}

/* ============ 爬楼页（连续计时 + 楼层累计 + 休息倒计时 + 结束打卡）============ */
const STAIR_LS = 'fitness_stair_v2';
let stair = {
  tab:'record',
  running:false, finished:false, elapsed:0, startedAt:0, timerId:null,
  floors:0, weight:65,
  laps:[],                // {floors, dur, t}
  lapStartAt:0, lapFloors:0,
  restRunning:false, restDone:false, restLeft:30, restTotal:30, restEndAt:0, restTimerId:null,
  sessions:[],            // {date,t,duration,floors,laps,kcal}
};
function loadStair(){ try{ const d=JSON.parse(localStorage.getItem(STAIR_LS)||'{}');
  if(Array.isArray(d.sessions)) stair.sessions=d.sessions;
  const w=parseInt(d.weight,10); if(w>20&&w<300) stair.weight=w;
  const r=parseInt(d.restLeft,10); if(r>0&&r<=3600) stair.restLeft=r;
  stair.running=false; stair.finished=false; stair.elapsed=0; stair.floors=0;
  stair.laps=[]; stair.lapStartAt=0; stair.lapFloors=0;
  stair.restRunning=false; stair.restDone=false; stair.restTimerId=null;
}catch(e){} }
function persistStair(){ localStorage.setItem(STAIR_LS, JSON.stringify({sessions:stair.sessions, weight:stair.weight, restLeft:stair.restLeft})); }
function stairKcal(){ return Math.round(stair.weight * stair.floors * 0.17); }

function setStairTab(t){ stair.tab=t; renderStair(); }
function setStairWeight(v){ const w=parseInt(v,10); if(w>20&&w<300){ stair.weight=w; persistStair(); renderStair(); } }
function setStairRest(v){ const r=parseInt(v,10); if(r>0&&r<=3600){ stair.restLeft=r; stair.restTotal=r; persistStair(); } }

function stairStart(){
  if(stair.running){ stairPause(); return; }
  if(stair.finished){ stairReset(); }
  stair.running=true;
  stair.startedAt = Date.now() - stair.elapsed;
  if(stair.lapStartAt===0) stair.lapStartAt = stair.elapsed;
  stair.timerId = setInterval(stairTick, 200);
  renderStair();
}
function stairPause(){
  if(!stair.running) return;
  stair.running=false; clearInterval(stair.timerId);
  stair.elapsed = Date.now() - stair.startedAt;
  renderStair();
}
function stairReset(){
  stair.running=false; stair.finished=false; clearInterval(stair.timerId);
  stair.elapsed=0; stair.startedAt=0; stair.floors=0;
  stair.laps=[]; stair.lapStartAt=0; stair.lapFloors=0;
  stairCancelRest();
  renderStair();
}
function stairTick(){
  if(!stair.running) return;
  stair.elapsed = Date.now() - stair.startedAt;
  stairPaint();
}
function stairPaint(){
  const t=$('stair-time'); if(t) t.textContent=fmt(stair.elapsed);
  const f=$('stair-floors'); if(f) f.textContent=stair.floors;
  const k=$('stair-kcal'); if(k) k.textContent=stairKcal();
  const s=$('stair-sub'); if(s) s.textContent=`已爬 ${stair.floors} 层 · ${stair.laps.length} 趟 · ${stairKcal()} kcal`;
}
function stairAddFloors(n){
  if(!stair.running) stairStart();   // 第一次加楼层时自动开始计时
  stair.floors += n;
  stair.lapFloors += n;
  stairPaint();
}
function stairSetFloors(v){
  const f=parseInt(v,10); if(isNaN(f)||f<0) return;
  if(!stair.running && f>0) stairStart();
  stair.floors = f;
  stairPaint();
}
function stairRecordLap(){
  if(stair.lapFloors<=0){ alert('这趟还没有爬楼层哦'); return; }
  const dur = Math.max(0, Math.round((stair.elapsed - stair.lapStartAt)/1000));
  stair.laps.push({ floors:stair.lapFloors, dur:dur, t:nowTime() });
  stair.lapStartAt = stair.elapsed;
  stair.lapFloors = 0;
  renderStair();
}
function stairFinish(){
  if(stair.lapFloors>0){
    const dur = Math.max(0, Math.round((stair.elapsed - stair.lapStartAt)/1000));
    stair.laps.push({ floors:stair.lapFloors, dur:dur, t:nowTime() });
  }
  stair.running=false; stair.finished=true; clearInterval(stair.timerId);
  stair.elapsed = Date.now() - stair.startedAt;
  stairCancelRest();
  stair.sessions.unshift({
    date:today(), t:nowTime(), duration:stair.elapsed,
    floors:stair.floors, laps:stair.laps.length, kcal:stairKcal(),
  });
  persistStair();
  Native.fire({ restSeconds:0, label:'爬楼完成', at:nowTime(), soundType:6 });
  renderStair();
}

/* —— 组间休息倒计时 —— */
function stairStartRest(sec){
  stairCancelRest();
  stair.restTotal=sec; stair.restLeft=sec; stair.restRunning=true; stair.restDone=false;
  stair.restEndAt = Date.now()+sec*1000;
  Native.scheduleCountdown(sec, stair.restEndAt);
  stair.restTimerId=setInterval(stairRestTick, 200);
  renderStair();
}
function stairRestTick(){
  if(!stair.restRunning) return;
  stair.restLeft = Math.max(0, Math.round((stair.restEndAt-Date.now())/1000));
  const el=$('stair-rest'); if(el) el.innerHTML=stairRestBarHtml();
  if(stair.restLeft>0) return;
  stair.restRunning=false; clearInterval(stair.restTimerId);
  stair.restDone=true;
  Native.cancelCountdown();
  Native.fire({ restSeconds:stair.restTotal, label:'爬楼休息结束 · 继续爬', at:nowTime(), soundType:5 });
  const el2=$('stair-rest'); if(el2) el2.innerHTML=stairRestBarHtml();
}
function stairCancelRest(){
  Native.cancelCountdown();
  stair.restRunning=false; stair.restDone=false; clearInterval(stair.restTimerId);
}
function stairRestBarHtml(){
  if(!stair.restRunning){
    if(stair.restDone) return `<div class="rest-bar done" id="stair-rest"><span class="rb-time">00:00</span><span class="rb-info"><b>休息结束！</b> 继续爬楼</span></div>`;
    return `<div class="rest-bar" id="stair-rest" style="display:none"></div>`;
  }
  return `<div class="rest-bar" id="stair-rest">
    <span class="rb-time">${fmt(stair.restLeft*1000)}</span>
    <span class="rb-info">休息中 · 到点响铃+锁屏提醒 <b>${stair.restLeft}秒</b></span>
    <button class="btn btn-ghost" onclick="stairCancelRest();renderStair()">跳过</button>
  </div>`;
}

}

/* ============ 笔记（纯本地存储，localStorage）============ */
const NOTES_LS = 'fitness_notes_v1';
let notes = [];
let noteDraft = '';
let noteDetailId = null;
let noteQuery = '';        // 搜索词（匹配正文 / 标签）
let noteTagFilter = '';    // 标签筛选（''=全部）
let noteSort = 'updated';  // updated | created | title
let noteMsel = false;      // 多选模式
const noteSelSet = new Set();
let noteSuggestTags = [];  // 标签联想候选 [[tag,count],...]
let noteSuggestIdx = -1;
let noteSheetId = null;    // 当前操作菜单对应的笔记 id

function escHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
function loadNotes(){ try{ const d=JSON.parse(localStorage.getItem(NOTES_LS)||'[]'); if(Array.isArray(d)) notes=d; }catch(e){} }
function persistNotes(){ localStorage.setItem(NOTES_LS, JSON.stringify(notes)); }
function noteTitle(n){ const line=(n.content||'').split('\n').find(x=>x.trim()); return line? line.trim() : '无标题'; }
function notePreview(n){ const lines=(n.content||'').split('\n').map(x=>x.trim()).filter(Boolean); return lines.slice(1).join(' '); }
function fmtNoteTime(ts){ if(!ts) return ''; const d=new Date(ts); const diff=Date.now()-ts;
  if(diff<60e3) return '刚刚'; if(diff<3600e3) return Math.floor(diff/60e3)+' 分钟前';
  if(diff<86400e3) return Math.floor(diff/3600e3)+' 小时前';
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

/* —— 标签：从正文解析 #标签 —— */
function extractTags(content){
  const m=String(content||'').match(/#([^\s#，。！？、；：""''()（）【】《》,.!?;:]+)/g)||[];
  const seen=new Set(), out=[];
  m.forEach(x=>{ const t=x.slice(1); if(t && !seen.has(t)){ seen.add(t); out.push(t); } });
  return out;
}
function noteTags(n){ return extractTags(n.content); }
function allTags(){   // [[tag,count],...] 按使用次数降序
  const map={};
  notes.forEach(n=>extractTags(n.content).forEach(t=>map[t]=(map[t]||0)+1));
  return Object.entries(map).sort((a,b)=>b[1]-a[1] || a[0].localeCompare(b[0],'zh'));
}

/* —— 过滤 / 排序 —— */
function filteredNotes(){
  return notes.filter(n=>{
    const tags=extractTags(n.content);
    if(noteTagFilter && !tags.some(t=>t.toLowerCase()===noteTagFilter.toLowerCase())) return false;
    if(noteQuery){
      const q=noteQuery.toLowerCase();
      if(!(n.content||'').toLowerCase().includes(q) && !tags.some(t=>t.toLowerCase().includes(q))) return false;
    }
    return true;
  });
}
function sortNotes(list){
  const cmp = noteSort==='created' ? (a,b)=>(b.createdAt||0)-(a.createdAt||0)
    : noteSort==='title' ? (a,b)=>{ const c=noteTitle(a).localeCompare(noteTitle(b),'zh'); return c || (b.updatedAt||0)-(a.updatedAt||0); }
    : (a,b)=>(b.updatedAt||0)-(a.updatedAt||0);
  return [...list].sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0) || cmp(a,b));
}

/* —— 笔记列表页 —— */
function notesPageHead(){
  return `<h2>📝 笔记 <span id="note-cnt" style="color:var(--sub);font-weight:400;font-size:12px"></span></h2>
  <div class="note-tools">
    <input class="note-q" id="note-q" placeholder="🔍 搜索内容 / 标签…" value="${escHtml(noteQuery)}"
      oninput="noteQuery=this.value;renderNoteList()">
    <select onchange="noteSort=this.value;renderNotes()">
      <option value="updated"${noteSort==='updated'?' selected':''}>更新时间</option>
      <option value="created"${noteSort==='created'?' selected':''}>创建时间</option>
      <option value="title"${noteSort==='title'?' selected':''}>标题 A-Z</option>
    </select>
    <button class="note-msel-btn${noteMsel?' on':''}" onclick="toggleNoteMsel()">${noteMsel?'完成':'多选'}</button>
  </div>`;
}
function renderNotes(){
  state.tab='notes';
  if(noteDetailId){ renderNoteDetail(noteDetailId); return; }
  $('app').innerHTML = notesPageHead() + '<div id="note-list"></div>' + (noteMsel ? mselBarHtml() : composerHtml());
  renderNoteList();
  const ta=$('note-composer');
  if(ta){ ta.value=noteDraft; autoGrow(ta); if(noteDraft){ ta.focus(); try{ ta.setSelectionRange(ta.value.length,ta.value.length); }catch(e){} } }
  refreshSidebar();
}
function renderNoteList(){
  const box=$('note-list'); if(!box) return;
  const list=sortNotes(filteredNotes());
  const cnt=$('note-cnt'); if(cnt) cnt.textContent=`${list.length}/${notes.length}`;
  const tags=allTags();
  let html=`<div class="note-tagbar">
    <span class="tag-chip all${!noteTagFilter?' on':''}" onclick="noteTagFilter='';renderNoteList()">全部</span>
    ${tags.map(([t,c])=>`<span class="tag-chip${noteTagFilter===t?' on':''}" onclick="noteTagFilter='${escHtml(t)}';renderNoteList()">#${escHtml(t)} ${c}</span>`).join('')}
  </div>`;
  if(list.length===0){
    html+=`<div class="empty" style="padding:30px 18px">${notes.length===0?'还没有笔记':'没有匹配的笔记'}<br>
      <span style="font-size:13px;color:var(--sub)">${notes.length===0?'在下方输入框写一条，点「发送」保存<br>输入 # 可添加标签，支持搜索 / 标签筛选 / 排序 / 多选':''}</span></div>`;
  } else {
    list.forEach(n=>{
      const t=noteTitle(n), pv=notePreview(n), ts=extractTags(n.content), sel=noteSelSet.has(n.id);
      html+=`<div class="note-item${sel?' sel':''}" style="margin-bottom:10px">
        <div class="group-head" onclick="onNoteCardTap('${n.id}')">
          ${noteMsel?`<span class="note-chk${sel?' on':''}" onclick="event.stopPropagation();toggleNoteSel('${n.id}')">${sel?'✓':''}</span>`:''}
          <span class="gidx" style="min-width:0;flex:1;color:var(--txt)">${escHtml(t)}</span>
          <span class="gtime">${n.pinned?'📌 ':''}${fmtNoteTime(n.updatedAt)}</span>
        </div>
        ${pv?`<div class="npv">${escHtml(pv)}</div>`:''}
        ${ts.length?`<div class="ntags">${ts.map(x=>`<span class="ntag">#${escHtml(x)}</span>`).join('')}</div>`:''}
      </div>`;
    });
  }
  box.innerHTML=html;
}

/* —— 底部输入区：紧凑符号栏 + 大输入框 + 标签联想 —— */
function composerHtml(){
  return `<div class="note-composer">
    <div class="nc-toolbar">
      <button class="nc-sym tag" onclick="insertNoteSymbol('#')">#</button>
      <button class="nc-sym" onclick="insertNoteSymbol('/')">/</button>
      <button class="nc-sym" onclick="insertNoteSymbol('@')">@</button>
      <button class="nc-sym" onclick="insertNoteSymbol('*')">*</button>
      <button class="nc-sym" onclick="insertNoteSymbol('-')">-</button>
      <button class="nc-sym" onclick="insertNoteSymbol('+')">+</button>
    </div>
    <div class="nc-wrap">
      <div class="tag-suggest" id="note-suggest" style="display:none"></div>
      <div class="nc-row">
        <textarea id="note-composer" rows="1" placeholder="记点什么… 输入 # 可添加标签"
          oninput="onComposerInput(this)" onkeydown="onComposerKeydown(event)"></textarea>
        <button class="nc-send" onclick="sendNote()">发送</button>
      </div>
    </div>
  </div>`;
}
function onComposerInput(ta){
  noteDraft=ta.value;
  autoGrow(ta);
  updateTagSuggest();
}
function autoGrow(ta){
  ta.style.height='auto';
  ta.style.height=Math.min(ta.scrollHeight,200)+'px';
}
function updateTagSuggest(){
  const ta=$('note-composer'), box=$('note-suggest');
  if(!ta || !box) return;
  const pos=ta.selectionStart!=null?ta.selectionStart:ta.value.length;
  const m=ta.value.slice(0,pos).match(/#([^\s#]*)$/);
  if(!m){ box.style.display='none'; noteSuggestTags=[]; noteSuggestIdx=-1; return; }
  const prefix=m[1].toLowerCase();
  const used=new Set(extractTags(ta.value).map(t=>t.toLowerCase()));
  const cands=allTags().filter(([t])=>!used.has(t.toLowerCase()) && (!prefix || t.toLowerCase().startsWith(prefix))).slice(0,8);
  noteSuggestTags=cands; noteSuggestIdx=-1;
  if(!cands.length){ box.style.display='none'; return; }
  box.style.display='block';
  box.innerHTML=`<div class="ts-title">标签联想（点击插入）</div>`+
    cands.map(([t,c])=>`<div class="ts-item" onmousedown="event.preventDefault()" onclick="pickTag('${escHtml(t)}')">#${escHtml(t)}<span class="ts-cnt">${c} 篇</span></div>`).join('');
}
function paintSuggest(){
  const box=$('note-suggest'); if(!box) return;
  box.querySelectorAll('.ts-item').forEach((el,i)=>el.classList.toggle('cur', i===noteSuggestIdx));
  const cur=box.querySelector('.ts-item.cur');
  if(cur) cur.scrollIntoView({block:'nearest'});
}
function onComposerKeydown(e){
  if(!noteSuggestTags.length) return;
  const box=$('note-suggest');
  if(!box || box.style.display==='none') return;
  if(e.key==='ArrowDown'){ e.preventDefault(); noteSuggestIdx=Math.min(noteSuggestIdx+1, noteSuggestTags.length-1); paintSuggest(); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); noteSuggestIdx=Math.max(noteSuggestIdx-1,-1); paintSuggest(); }
  else if(e.key==='Enter' && noteSuggestIdx>=0){ e.preventDefault(); pickTag(noteSuggestTags[noteSuggestIdx][0]); }
  else if(e.key==='Escape'){ box.style.display='none'; noteSuggestTags=[]; noteSuggestIdx=-1; }
}
function pickTag(tag){
  const ta=$('note-composer'); if(!ta) return;
  const pos=ta.selectionStart!=null?ta.selectionStart:ta.value.length;
  const before=ta.value.slice(0,pos);
  const m=before.match(/#([^\s#]*)$/);
  const start=pos-(m?m[0].length:1);
  const after=ta.value.slice(pos);
  const suffix=after.startsWith(' ')?'':' ';
  ta.value=ta.value.slice(0,start)+'#'+tag+suffix+after;
  noteDraft=ta.value;
  try{ ta.setSelectionRange(start+tag.length+2, start+tag.length+2); }catch(e){}
  ta.focus();
  updateTagSuggest();
}
function insertNoteSymbol(sym){
  const ta=document.getElementById('note-composer');
  if(!ta) return;
  const s=ta.selectionStart!=null?ta.selectionStart:ta.value.length;
  const e=ta.selectionEnd!=null?ta.selectionEnd:ta.value.length;
  ta.value=ta.value.slice(0,s)+sym+ta.value.slice(e);
  noteDraft=ta.value;
  ta.focus();
  const pos=s+sym.length;
  try{ ta.setSelectionRange(pos,pos); }catch(err){}
  if(sym==='#') updateTagSuggest();
}
function sendNote(){
  const text=(noteDraft||'').trim();
  if(!text){ const ta=$('note-composer'); if(ta) ta.focus(); return; }
  notes.unshift({ id:uid(), content:text, pinned:false, createdAt:Date.now(), updatedAt:Date.now() });
  noteDraft='';
  persistNotes(); renderNotes();
}

/* —— 多选 —— */
function toggleNoteMsel(){
  noteMsel=!noteMsel;
  if(!noteMsel) noteSelSet.clear();
  renderNotes();
}
function onNoteCardTap(id){
  if(noteMsel){ toggleNoteSel(id); return; }
  openNoteSheet(id);
}
function toggleNoteSel(id){
  if(noteSelSet.has(id)) noteSelSet.delete(id); else noteSelSet.add(id);
  renderNotes();
}
function selAll(){
  const ids=filteredNotes().map(n=>n.id);
  const all=ids.length>0 && ids.every(id=>noteSelSet.has(id));
  if(all) ids.forEach(id=>noteSelSet.delete(id)); else ids.forEach(id=>noteSelSet.add(id));
  renderNotes();
}
function mselBarHtml(){
  return `<div class="msel-bar">
    <span class="msel-cnt">已选 ${noteSelSet.size} 条</span>
    <button class="btn btn-ghost" onclick="noteSelSet.clear();renderNotes()">清空</button>
    <button class="btn btn-ghost" onclick="selAll()">全选</button>
    <button class="btn btn-ghost" onclick="mselPin(true)">置顶</button>
    <button class="btn btn-ghost" onclick="mselPin(false)">取消置顶</button>
    <button class="btn btn-stop" onclick="mselDelete()">删除</button>
  </div>`;
}
function mselPin(pin){
  if(!noteSelSet.size){ alert('请先勾选笔记'); return; }
  notes.forEach(n=>{ if(noteSelSet.has(n.id)){ n.pinned=pin; n.updatedAt=Date.now(); } });
  persistNotes(); renderNotes();
}
function mselDelete(){
  if(!noteSelSet.size){ alert('请先勾选笔记'); return; }
  if(!confirm(`删除选中的 ${noteSelSet.size} 条笔记？`)) return;
  notes=notes.filter(n=>!noteSelSet.has(n.id));
  noteSelSet.clear();

}

/* —— 操作菜单：点击笔记弹出，不再直接进详情 —— */
function openNoteSheet(id){
  const n=notes.find(x=>x.id===id); if(!n) return;

      ${ts.length?`<div class="as-tags">${ts.map(t=>`<span class="as-tag" onclick="sheetFilterTag('${escHtml(t)}')">#${escHtml(t)}</span>`).join('')}</div>`:''}
    </div>

    </div>`;
}
function closeNoteSheet(){
  noteSheetId=null;

  if(sheet) sheet.classList.remove('show');
}
function sheetPin(id){ closeNoteSheet(); toggleNotePin(id); }
function sheetDelete(id){ closeNoteSheet(); deleteNote(id); }
function sheetCopy(id){ closeNoteSheet(); copyNote(id); }
function sheetFilterTag(t){ closeNoteSheet(); noteTagFilter=t; noteQuery=''; renderNotes(); }

/* —— 笔记详情：可编辑内容，删除/复制/置顶在这里（输入框不含这些） —— */
function openNoteDetail(id){ noteDetailId=id; renderNotes(); }
function backFromNote(){ noteDetailId=null; renderNotes(); }
function updateNoteContent(id, v){ const n=notes.find(x=>x.id===id); if(!n) return; n.content=v; n.updatedAt=Date.now(); persistNotes(); }
function toggleNotePin(id){ const n=notes.find(x=>x.id===id); if(!n) return; n.pinned=!n.pinned; n.updatedAt=Date.now(); persistNotes(); renderNotes(); }
function deleteNote(id){
  if(!confirm('删除这条笔记？')) return;
  notes=notes.filter(x=>x.id!==id); persistNotes(); noteDetailId=null; renderNotes();
}
function copyText(text, okMsg){
  const done=()=>alert(okMsg||'已复制 ✔');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));
  } else fallbackCopy(text,done);
}
function fallbackCopy(text, done){
  try{
    const ta=document.createElement('textarea');
    ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    const ok=document.execCommand('copy');
    document.body.removeChild(ta);
    if(ok) done(); else alert('复制失败，请手动长按选择');
  }catch(e){ alert('复制失败，请手动长按选择'); }
}
function copyNote(id){
  const n=notes.find(x=>x.id===id); if(!n) return;
  const text=(n.content||'').trim();
  if(!text){ alert('这条笔记是空的'); return; }
  copyText(text);
}
function renderNoteDetail(id){
  const n=notes.find(x=>x.id===id); if(!n){ noteDetailId=null; renderNotes(); return; }
  const t=noteTitle(n), ts=extractTags(n.content);
  let html=`<div class="rec-head" style="margin-bottom:8px">
    <span class="rh-title">📝 笔记详情 <span style="color:var(--sub);font-weight:400;font-size:12px">${escHtml(t)}</span></span>
    <button class="rh-close" onclick="backFromNote()">返回 ✕</button>
  </div>
  ${ts.length?`<div class="ntags" style="padding:0 2px 10px">${ts.map(x=>`<span class="ntag">#${escHtml(x)}</span>`).join('')}</div>`:''}
  <div class="card" style="padding:10px">
    <textarea id="note-editor" class="inline-input" style="min-height:50vh;resize:none;line-height:1.7;font-size:15px" placeholder="编辑这条笔记…（自动保存，输入 # 可加标签）" oninput="updateNoteContent('${n.id}', this.value)">${escHtml(n.content)}</textarea>
  </div>
  <div class="note-actions">
    <button class="btn btn-ghost" onclick="copyNote('${n.id}')">📋 复制</button>
    <button class="btn btn-ghost" onclick="toggleNotePin('${n.id}')">${n.pinned?'📌 取消置顶':'📌 置顶'}</button>
    <button class="btn btn-stop" onclick="deleteNote('${n.id}')">🗑 删除</button>
  </div>`;
  $('app').innerHTML=html;
  const ta=$('note-editor');
  if(ta){ ta.focus(); const len=ta.value.length; try{ ta.setSelectionRange(len,len); }catch(e){} }
}

/* ============ 侧边栏 ============ */
function openSidebar(){ $('sidebar').classList.add('open'); $('backdrop').classList.add('show'); refreshSidebar(); }
function closeSidebar(){ $('sidebar').classList.remove('open'); $('backdrop').classList.remove('show'); }
function goTab(tab){ closeSidebar(); switchTab(tab); }
function refreshSidebar(){
  const el=$('sb-stats'); if(!el) return;
  el.innerHTML=`训练 <b>${state.groups.length}</b> 组 · HIIT <b>${hiit.sessions.length}</b> 次 · 爬楼 <b>${stair.sessions.length}</b> 次 · 历史 <b>${state.records.length}</b> 条 · 笔记 <b>${notes.length}</b> 篇`;
}

/* ============ 原生桥接（安卓 App 强提醒）============
 * 在 WebView 里，安卓会注入 window.FitnessNative（addJavascriptInterface）。
 * 打包成 App 时：倒计时归零 → 原生弹「锁屏弹窗 + 悬浮窗 + 震动」。
 * 在普通浏览器调试时：走降级（Notification + 震动 + 蜂鸣），保证不报错。
 */
window.FitnessNative = window.FitnessNative || null;
const Native = {
  fire(payload){                    // 倒计时归零 → 触发强提醒
    if(window.FitnessNative && window.FitnessNative.fire) try{ window.FitnessNative.fire(JSON.stringify(payload)); return true; }catch(e){}
    return this._fallbackFire(payload);
  },
  dismiss(){                        // 用户点了「记录这组 / 关闭」→ 关掉弹窗与震动
    if(window.FitnessNative && window.FitnessNative.dismiss) try{ window.FitnessNative.dismiss(); }catch(e){}
  },
  scheduleCountdown(totalSec, endAt){ // 把倒计时交给系统精确闹钟（锁屏/后台也准点）
    if(totalSec<=0 || endAt<=Date.now()) return; // 0 秒/已过期不调度：避免瞬间触发
    try{ if(window.FitnessNative && window.FitnessNative.scheduleCountdown) window.FitnessNative.scheduleCountdown(totalSec, endAt); }catch(e){}
  },
  cancelCountdown(){                // 暂停/重置/记录完成时取消系统闹钟
    try{ if(window.FitnessNative && window.FitnessNative.cancelCountdown) window.FitnessNative.cancelCountdown(); }catch(e){}
  },
  requestExactAlarm(){              // 跳转「精确闹钟」授权页
    try{ if(window.FitnessNative && window.FitnessNative.requestExactAlarm) window.FitnessNative.requestExactAlarm(); }catch(e){}
  },
  requestBattery(){                 // 跳转「忽略电池优化」授权页
    try{ if(window.FitnessNative && window.FitnessNative.requestBattery) window.FitnessNative.requestBattery(); }catch(e){}
  },
  setSoundForType(type, mode){
    try{ if(window.FitnessNative && window.FitnessNative.setSoundForType) window.FitnessNative.setSoundForType(type, mode); }catch(e){}
  },
  getSoundConfig(){
    try{ if(window.FitnessNative && window.FitnessNative.getSoundConfig) return JSON.parse(window.FitnessNative.getSoundConfig()); }catch(e){}
    return null;
  },
  fireFinish(restSeconds){          // 倒计时归零：先取消系统闹钟，再直接触发强提醒（前台即时路径）
    this.cancelCountdown();
    this.fire({ restSeconds, label:'休息结束', at: nowTime() });
  },
  _fallbackFire(p){
    try{ if(window.Notification && Notification.permission==='granted')
      new Notification('休息结束', { body:`${p.label||'计时器'} · ${p.restSeconds||''}秒`, tag:'fitness-alarm' }); }catch(e){}
    try{ if(navigator.vibrate) navigator.vibrate([600,200,600,200,600,200,600]); }catch(e){}
    try{ const C=window.AudioContext||window.webkitAudioContext; if(C){ const c=new C();
      const o=c.createOscillator(), g=c.createGain(); o.connect(g); g.connect(c.destination);
      o.type='sine'; o.frequency.value=880; g.gain.value=0.3; o.start(); setTimeout(()=>o.stop(),1500);} }catch(e){}
    return false;
  }
};

/* ============ Tab 切换 ============ */
function switchTab(tab){
  state.tab=tab;
  document.querySelectorAll('.sb-nav button').forEach(b=>b.classList.toggle('on', b.dataset.tab===tab));
  document.body.classList.toggle('notes-mode', tab==='notes');   // 笔记页不显示底部 tab 栏
  if(tab!=='notes') closeNoteSheet();                            // 离开笔记页时收起操作菜单
  if(tab==='train') renderTrain();
  else if(tab==='hiit') renderHiit();
  else if(tab==='stair') renderStair();
  else if(tab==='settings') renderSettings();
  else if(tab==='notes') renderNotes();
  refreshSidebar();
}

/* ============ 初始化 ============ */
function init(){
  load(); loadNotes(); loadHiit(); loadStair(); renderTrain(); tick();
  refreshSidebar();
  const sc = Native.getSoundConfig();
  if(sc && typeof sc==='object'){ for(let t=0; t<=6; t++){ if(sc[t]!==undefined) soundCfg[t]=sc[t]; } }
  const verEl=$('app-version');
  if(verEl) verEl.textContent = window.APP_VERSION ? 'v'+window.APP_VERSION : '';
  window.addEventListener('beforeunload', persist);
}
init();
</script>
