plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.fitness'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.fitness"
        minSdk 26                 // Android 8.0+（悬浮窗/锁屏弹窗所需 API 均覆盖）
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false   // 先关闭混淆，方便调试；上线可开启
            signingConfig signingConfigs.debug   // release 复用 debug 签名，方便直接安装
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
}

// kotlin-stdlib 1.8+ 已合并 jdk7/jdk8 类；排除旧构件避免 checkDebugDuplicateClasses 报重复类
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
