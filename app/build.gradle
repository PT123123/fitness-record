plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.fitness'
    compileSdk 34

    signingConfigs {
        release {
            // 统一使用共用签名密钥（C:\Users\ted\keystores\debug.keystore，别名 androiddebugkey / 口令 android）
            storeFile file("C:/Users/ted/keystores/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    defaultConfig {
        applicationId "com.example.fitness"
        minSdk 26                 // Android 8.0+（悬浮窗/锁屏弹窗所需 API 均覆盖）
        targetSdk 34
        versionCode 125           // 与版本号 1.2.5 对应
        versionName "1.2.5"
    }

    buildTypes {
        release {
            minifyEnabled false   // 先关闭混淆，方便调试；上线可开启
            signingConfig signingConfigs.release   // 统一用共用 debug.keystore（C:\Users\ted\keystores）签名
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
}

// kotlin-stdlib 1.8+ 已合并 jdk7/jdk8 类；排除旧构件避免 checkDebugDuplicateClasses 报重复类
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
